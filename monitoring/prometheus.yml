global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-exporter:9835']

  - job_name: 'flask'
    static_configs:
      - targets: ['flask:6000']
    metrics_path: /health

  - job_name: 'go'
    static_configs:
      - targets: ['go:8080']
    metrics_path: /api/health
