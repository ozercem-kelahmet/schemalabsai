name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to GCP
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 34.9.180.204
          username: ozercemkelahmet
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /opt/schemalabsai
            git fetch origin
            git reset --hard origin/main
            export PATH=$PATH:/usr/local/go/bin
            go mod tidy
            go build -o schemalabsai main.go
            sudo systemctl stop schemalabs-go
            sudo pkill -9 schemalabsai 2>/dev/null || true
            sudo pkill -9 -f server.py 2>/dev/null || true
            sleep 2
            sudo systemctl reset-failed schemalabs-go
            sudo systemctl start schemalabs-go
