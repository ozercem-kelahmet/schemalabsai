apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: schemalabs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: gcr.io/schema-478207/schemalabsai-flask:latest
        ports:
        - containerPort: 6000
        env:
        - name: FLASK_PORT
          value: "6000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: schemalabs-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: schemalabs-secrets
              key: REDIS_URL
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schemalabs-secrets
              key: REDIS_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 6000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 6000
          initialDelaySeconds: 45
          periodSeconds: 15
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: schemalabs
spec:
  selector:
    app: flask
  ports:
  - port: 6000
    targetPort: 6000
